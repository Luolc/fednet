# PR and main gate: secret scan of the new commits, pre-commit on all files,
# the docs/design.md length check and its test, the tests of the release
# guards, then the Go checks (gofmt, vet, race-enabled tests). The job name
# `check` is the required status check. A release reads the result of this
# workflow on main; see release-ci-green.sh.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Every main commit needs a result of its own, since a release reads it, so
  # each one gets its own group: a shared group would cancel a pending run
  # when a newer one arrives. On a PR branch, a newer push cancels the older
  # run.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read # gitleaks-action lists the commits of the PR

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scan below reads the commits of the PR or push, which a
          # shallow clone would not have.
          fetch-depth: 0

      # The other half of secret scanning. The pre-commit gitleaks hook only
      # scans the staged diff; CI has no staged diff, so this step scans the
      # commits of this PR or push, and gitleaks.yml scans the whole history
      # weekly. The hook is the only thing that stops a secret before it
      # becomes a commit; these scans are what catch one that got in anyway
      # (via --no-verify, or a clone without the hook). The action runs
      # gitleaks with --redact, so a hit does not print the secret.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The version the pre-commit hook pins.
          GITLEAKS_VERSION: 8.30.1
          # Commenting on the PR would need pull-requests: write; the job
          # log and summary show the finding.
          GITLEAKS_ENABLE_COMMENTS: false

      - id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # Hook environments are keyed by the config hash: any rev bump or hook
      # change misses the cache and rebuilds them. The exact Python version
      # (patch level included) is part of the key: pre-commit discards a
      # virtualenv whose base interpreter is not the one now installed, and
      # the runner image's patch release changes over time.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install --user pre-commit==4.6.2

      # The gitleaks hook scans the staged diff, which is empty in CI, so it
      # would do nothing but build its environment (Go source build on a cold
      # cache). The scan above does the work, so skip the hook.
      - run: pre-commit run --all-files
        env:
          SKIP: gitleaks

      - name: Design length test
        run: .github/scripts/design-length.test.sh

      - name: Design length (docs/design.md, at most 200 lines)
        run: .github/scripts/design-length.sh

      - name: Release guard tests
        # The waiting arms of release-ci-green.test.sh poll without a pause.
        timeout-minutes: 5
        run: |
          .github/scripts/release-version.test.sh
          .github/scripts/release-on-main.test.sh
          .github/scripts/release-ci-green.test.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # gofmt -l exits 0 even when it lists files, so fail on any output.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - run: go test -race ./...
