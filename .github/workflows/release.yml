# Release: a pushed vX.Y.Z tag becomes a GitHub release with the binaries
# fednet_vX.Y.Z_linux_amd64 and fednet_vX.Y.Z_linux_arm64 and a SHA256SUMS
# file in `sha256sum` format. Deployment and self-upgrade download these
# names, so they are a contract; see deploy/README.md.
#
# Order: the tagged commit must be on main, and its CI run on main (ci.yml,
# started by the push to main) must have passed at the first attempt; CI is
# not run again here. Then each architecture is built on its own runner and
# its binary must report the tag as its version. Only then is the release
# created.
#
# workflow_dispatch is a dry run of everything but the release: it builds
# the commit it runs on as the given version and publishes nothing.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build as, vX.Y.Z (dry run, nothing is published)
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  on-main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The guard compares against origin/main, which a shallow clone
          # does not have.
          fetch-depth: 0
      - run: .github/scripts/release-on-main.sh "$GITHUB_SHA" origin/main

  ci-green:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # the CI runs of the tagged commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-ci-green.sh "$GITHUB_SHA"

  build:
    needs: [on-main, ci-green]
    strategy:
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
          - goarch: arm64
            runner: ubuntu-24.04-arm
    # Native runners, so that each binary can run `fednet version` below.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir dist
          go build -trimpath -ldflags "-X main.version=${VERSION}" \
            -o "dist/fednet_${VERSION}_linux_${GOARCH}" ./cmd/fednet

      - name: Version guard
        run: .github/scripts/release-version.sh "$VERSION" "dist/fednet_${VERSION}_linux_${{ matrix.goarch }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fednet-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: [on-main, ci-green, build]
    # Only a pushed tag publishes; a workflow_dispatch run stops after build.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fednet-*
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum "fednet_${VERSION}_linux_amd64" "fednet_${VERSION}_linux_arm64" >SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$VERSION" --generate-notes \
            "dist/fednet_${VERSION}_linux_amd64" "dist/fednet_${VERSION}_linux_arm64" dist/SHA256SUMS
