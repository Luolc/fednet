display_information:
  name: fednet
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
    agent_tasks_enabled: true
  bot_user:
    display_name: fednet
    always_online: true
  slash_commands:
    - command: /fednet
      description: fednet version and upgrade
      should_escape: false
      usage_hint: version | upgrade
oauth_config:
  scopes:
    bot:
      - reactions:read
      - channels:history
      - channels:manage
      - channels:read
      - channels:write.invites
      - channels:write.topic
      - chat:write
      - commands
      - files:read
      - files:write
      - groups:history
      - groups:read
      - groups:write
      - im:history
      - im:read
      - im:write
      - incoming-webhook
      - users:read
      - reactions:write
  pkce_enabled: false
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
      - reaction_added
      - reaction_removed
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  is_mcp_enabled: false
  token_rotation_enabled: false
  app_level_token_rotation_enabled: false
